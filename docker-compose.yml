services:
  # --- 1. หน้าบ้าน (Client) ---
  client:
    image: nontprawitch/taskflow-client:latest
    ports:
      - "80:80"  # หรือพอร์ตที่ลูกพี่ตั้งไว้ เช่น "5173:5173"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # 🌟 ดึงไฟล์กุญแจ SSL เข้าไปให้ Nginx อ่าน
    depends_on:
      - server

  # --- 2. หลังบ้าน (Server) ---
  server:
    image: nontprawitch/taskflow-server:latest
    ports:
      - "3231:3231"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/taskflow?schema=public
    env_file:
      - .env

  # --- 3. ฐานข้อมูล (DB) ---
  postgres:
    image: postgres:15-alpine
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: taskflow

volumes:
  taskflow_postgres_data: