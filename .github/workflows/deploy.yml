name: CD Taskflow

on:
  workflow_run:
    workflows: ["CI and Test"]
    branches: ["main"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: ./server   
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/taskflow-server:latest

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client  
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/taskflow-client:latest
          build-args: |
            VITE_API_URL=${{secrets.VITE_API_URL}}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3   # ✅ แก้ชื่อเป็น appleboy แล้ว
        with:
          host: ${{secrets.AZURE_IP}}
          username: azureuser
          key: ${{secrets.AZURE_SSH_KEY}}
          script: |   # ✅ ใส่เครื่องหมาย | เพื่อรันหลายบรรทัด
            set -e

            cd ~/TaskFlow

            git fetch --all
            git reset --hard origin/main

            echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" > .env          
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-server:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/taskflow-client:latest
            
            # สั่งรันใหม่ทั้งหมด
            docker-compose up -d
            
            sleep 5

            docker-compose exec -T server npx prisma db push