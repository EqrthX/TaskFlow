name: CI and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        # Health Check: รอจนกว่า Database จะพร้อมใช้งานจริงๆ
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. ลง Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./server/package-lock.json

      # 5. ลง Library
      - name: Install dependencies
        run: npm install
        working-directory: ./server

        # 6. สร้าง Table ใน Database (สำคัญ!)
      - name: Run Prisma Push
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/taskflow?schema=public"
        run: npx prisma db push
        working-directory: ./server

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/taskflow?schema=public"
          JWT_SECRET: "test-secret"
        run: npm test
        working-directory: ./server

  e2e-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./playright-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./playright-test/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Broswers
        run: npx playwright install --with-deps

      - name: Run Playwright test
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./playright-test/playwright-report/
          retention-days: 30
